# HP Googlebook (Google Quartz) speakers: the UCM "Speaker" device has four
# channels, one per amplifier. By ear, channels 0-3 are the top left, top
# right, bottom right and bottom left speakers, so the rear pair is swapped
# relative to PipeWire's default FL FR RL RR. Copying stereo to the rear is
# a stream setting, in /etc/pipewire/{client,pipewire-pulse}.conf.d/.
monitor.alsa.rules = [
  {
    matches = [
      {
        alsa.card_name = "X1E80100-Google-Quartz"
        node.name = "~alsa_output.*Speaker.*"
      }
    ]
    actions = {
      update-props = {
        audio.position = [ FL, FR, RR, RL ]
      }
    }
  }
]
